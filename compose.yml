services:
  postgres:
    image: postgres:15
    container_name: odiya-news-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: odiya_news
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: change-me
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d odiya_news"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - odiya_news_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: odiya-news-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - odiya_news_redis_data:/data

  api:
    build: .
    container_name: odiya-news-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:change-me@postgres:5432/odiya_news
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - FIREBASE_CREDENTIALS_JSON=${FIREBASE_CREDENTIALS_JSON}
      - APP_ENV=development
      - DEBUG=True
      - AUTO_CREATE_TABLES=True
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  odiya_news_postgres_data:
  odiya_news_redis_data:
