services:
  postgres:
    image: postgres:15
    container_name: odiya-news-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: odiya_news
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: change-me
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d odiya_news"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - odiya_news_postgres_data:/var/lib/postgresql/data

volumes:
  odiya_news_postgres_data:
